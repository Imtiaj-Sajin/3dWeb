<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f6e7c9" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌞</text></svg>" />
    <title>Warm Afternoon</title>
  </head>
  <body>
    <div id="app"></div>

    <!-- Loading / title overlay -->
    <div id="overlay">
      <div class="overlay-inner">
        <h1 class="title">Warm Afternoon</h1>
        <p class="subtitle">a little walk in the sun</p>
        <div class="progress-track" id="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <button id="enter-btn" class="enter-btn" disabled>loading&hellip;</button>
        <p class="credits">characters by KayKit (CC0)</p>
      </div>
    </div>

    <!-- In-game hint -->
    <div id="hint" class="hint hidden"></div>

    <!-- Soft vignette -->
    <div class="vignette"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
